map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server_tokens off;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

server {
    listen 80;
    server_name gym4me.ir www.gym4me.ir app.gym4me.ir admin.gym4me.ir business.gym4me.ir api.gym4me.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gym4me.ir www.gym4me.ir;

    ssl_certificate /etc/letsencrypt/live/gym4me.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym4me.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /business {
        return 308 https://business.gym4me.ir/;
    }

    location ~ ^/business/(.*)$ {
        return 308 https://business.gym4me.ir/$1;
    }

    location / {
        proxy_pass http://website:7080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.gym4me.ir;
    ssl_certificate /etc/letsencrypt/live/gym4me.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym4me.ir/privkey.pem;

    location / {
        proxy_pass http://application:7081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.gym4me.ir;
    ssl_certificate /etc/letsencrypt/live/gym4me.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym4me.ir/privkey.pem;

    location / {
        proxy_pass http://admin:7082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name business.gym4me.ir;
    ssl_certificate /etc/letsencrypt/live/gym4me.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym4me.ir/privkey.pem;

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /business {
        return 308 /;
    }

    location ~ ^/business/(.*)$ {
        return 308 /$1;
    }

    location / {
        proxy_pass http://business:7083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.gym4me.ir;
    ssl_certificate /etc/letsencrypt/live/gym4me.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym4me.ir/privkey.pem;
    client_max_body_size 25m;

    location / {
        proxy_pass http://backend:7088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
