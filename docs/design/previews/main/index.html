<!doctype html>
<html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club4Me — پیش‌نمایش صفحات</title>
<style>
@font-face{font-family:IRANSansX;src:url('../../../../packages/theme/fonts/IRANSansXV.woff2')}*{box-sizing:border-box}body{margin:0;background:#141618;color:#f3f3f4;font-family:IRANSansX,Tahoma,sans-serif}header{max-width:1140px;margin:32px auto 24px;display:flex;gap:24px;align-items:center;justify-content:space-between}h1{font-size:28px;margin:8px 0}p{color:#aeb0b5;font-size:13px;line-height:1.8;margin:0}.brand{color:#10f457;font-size:12px;letter-spacing:2px;font-family:sans-serif}.tabs{display:flex;padding:5px;border:1px solid #393c43;border-radius:20px;gap:4px}button{font:inherit;padding:10px 24px;border:0;border-radius:14px;background:none;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#10f457;color:#111214}.grid{max-width:1140px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}h2{font-size:16px;margin:0 0 14px;font-weight:600}img{display:block;width:100%;border-radius:26px;border:1px solid #393c43}a{color:inherit;text-decoration:none}footer{max-width:1140px;margin:20px auto 30px;color:#aeb0b5;font-size:11px}body.light{background:#eeeef0;color:#111214}body.light p,body.light footer{color:#676c75}@media(max-width:760px){header{margin:24px 20px;flex-direction:column;align-items:start}.grid{grid-template-columns:1fr;margin:20px;gap:28px}footer{margin:20px}img{max-width:400px}}
</style>
<header><div><span class="brand">CLUB4ME / SANDOW</span><h1>صفحات اصلی جیم‌فورمی</h1><p>خانه، حساب و برنامهٔ تمرین؛ با هدر مشترک و سبز اصلی برند</p></div><div class="tabs" aria-label="تم پیش‌نمایش"><button aria-pressed="true" data-theme="dark">تاریک</button><button aria-pressed="false" data-theme="light">روشن</button></div></header>
<main class="grid"><section><h2>خانه</h2><a href="home-dark-375.png"><img data-page="home" src="home-dark-375.png" alt="خانه"></a></section><section><h2>پروفایل</h2><a href="profile-dark-375.png"><img data-page="profile" src="profile-dark-375.png" alt="پروفایل"></a></section><section><h2>تنظیمات</h2><a href="settings-dark-375.png"><img data-page="settings" src="settings-dark-375.png" alt="تنظیمات"></a></section><section><h2>رزروها</h2><a href="reservations-dark-375.png"><img data-page="reservations" src="reservations-dark-375.png" alt="رزروها"></a></section><section><h2>خانهٔ مربی</h2><a href="coach-home-dark-375.png"><img data-page="coach-home" src="coach-home-dark-375.png" alt="خانهٔ مربی"></a></section><section><h2>کلاس‌های من</h2><a href="classes-dark-375.png"><img data-page="classes" src="classes-dark-375.png" alt="کلاس‌های من"></a></section><section><h2>اعلان‌ها</h2><a href="notifications-dark-375.png"><img data-page="notifications" src="notifications-dark-375.png" alt="اعلان‌ها"></a></section><section><h2>ذخیره‌شده‌ها</h2><a href="favorites-dark-375.png"><img data-page="favorites" src="favorites-dark-375.png" alt="ذخیره‌شده‌ها"></a></section><section><h2>عضویت‌ها</h2><a href="memberships-dark-375.png"><img data-page="memberships" src="memberships-dark-375.png" alt="عضویت‌ها"></a></section><section><h2>کیف پول</h2><a href="benefits-dark-375.png"><img data-page="benefits" src="benefits-dark-375.png" alt="کیف پول"></a></section><section><h2>پشتیبانی</h2><a href="support-dark-375.png"><img data-page="support" src="support-dark-375.png" alt="پشتیبانی"></a></section></main><footer>تصاویر اجرای واقعی اپ با دادهٔ نمونه · برای مشاهده در اندازهٔ کامل، تصویر را باز کنید.</footer>
<script>document.querySelectorAll('button[data-theme]').forEach(button=>button.addEventListener('click',()=>{const theme=button.dataset.theme;document.body.className=theme;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('img[data-page]').forEach(img=>{img.src=img.dataset.page+'-'+theme+'-375.png';img.parentElement.href=img.src})}));</script>
</html>
