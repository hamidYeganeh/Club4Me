<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>یکدستی صفحات اپلیکیشن</title><style>*{box-sizing:border-box}body{margin:0;background:#111313;color:#f4f6f5;font:16px/1.8 Tahoma,sans-serif}header{max-width:1200px;margin:auto;padding:32px 20px}h1{font-size:26px}p{color:#aeb6b3}button{min-height:44px;border:0;border-radius:14px;padding:10px 22px;cursor:pointer;margin:4px;font:inherit}button[aria-pressed=true]{background:#00ef67;color:#06140b}main{max-width:1200px;margin:auto;padding:0 20px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}figure{margin:0}img{width:100%;height:auto;border-radius:24px;border:1px solid #353c38}figcaption{padding:12px 0;font-weight:bold}a{color:inherit}small{color:#aeb6b3}</style><header><h1>ادامهٔ طراحی اپلیکیشن</h1><p>پیش‌نمایش صفحات واقعی اپ با دادهٔ آزمایشی؛ طراحی موبایل‌فرست و رنگ برند ثابت.</p><button data-theme="dark" aria-pressed="true">تم تیره</button><button data-theme="light" aria-pressed="false">تم روشن</button><p><small>برای دیدن تصویر کامل روی آن بزنید. عرض‌های ۳۷۵ و ۸۲۰ پیکسل بررسی شده‌اند.</small></p></header><main><figure><figcaption>خوش‌آمدگویی</figcaption><a data-image="welcome" href="welcome-dark-375.png"><img data-image="welcome" src="welcome-dark-375.png" alt="خوش‌آمدگویی" loading="lazy"></a></figure><figure><figcaption>معرفی اپ</figcaption><a data-image="introduce" href="introduce-dark-375.png"><img data-image="introduce" src="introduce-dark-375.png" alt="معرفی اپ" loading="lazy"></a></figure><figure><figcaption>ورودی حساب</figcaption><a data-image="auth" href="auth-dark-375.png"><img data-image="auth" src="auth-dark-375.png" alt="ورودی حساب" loading="lazy"></a></figure><figure><figcaption>مدیریت رزرو مربی</figcaption><a data-image="workspace" href="workspace-dark-375.png"><img data-image="workspace" src="workspace-dark-375.png" alt="مدیریت رزرو مربی" loading="lazy"></a></figure><figure><figcaption>فرم کلاس</figcaption><a data-image="class" href="class-dark-375.png"><img data-image="class" src="class-dark-375.png" alt="فرم کلاس" loading="lazy"></a></figure><figure><figcaption>فرم خدمت</figcaption><a data-image="service" href="service-dark-375.png"><img data-image="service" src="service-dark-375.png" alt="فرم خدمت" loading="lazy"></a></figure><figure><figcaption>پروفایل حرفه‌ای</figcaption><a data-image="professional" href="professional-dark-375.png"><img data-image="professional" src="professional-dark-375.png" alt="پروفایل حرفه‌ای" loading="lazy"></a></figure><figure><figcaption>صفحه پیدا نشد</figcaption><a data-image="not-found" href="not-found-dark-375.png"><img data-image="not-found" src="not-found-dark-375.png" alt="صفحه پیدا نشد" loading="lazy"></a></figure></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('[data-image]').forEach(x=>{const path=x.dataset.image+'-'+b.dataset.theme+'-375.png';if(x.tagName==='IMG')x.src=path;else x.href=path;});});</script></html>
