name: Android release bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic app version, for example 1.2.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Play version code
        required: true
        type: number

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Restore Firebase Android configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/application/android/app/google-services.json
      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gym4me-release.jks"
      - name: Validate mobile production configuration
        shell: bash
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NESHAN_MAP_KEY: ${{ secrets.NEXT_PUBLIC_NESHAN_MAP_KEY }}
          SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ "$API_URL" != https://* ]]; then
            echo "NEXT_PUBLIC_API_URL must be a public HTTPS URL" >&2
            exit 1
          fi
          for required in NESHAN_MAP_KEY SENTRY_DSN GOOGLE_SERVICES_JSON_BASE64; do
            if [[ -z "${!required}" ]]; then
              echo "$required is required for a production Android build" >&2
              exit 1
            fi
          done
      - run: npm run build:cap -w apps/application
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WEBSITE_URL: https://gym4me.ir
          NEXT_PUBLIC_NESHAN_MAP_KEY: ${{ secrets.NEXT_PUBLIC_NESHAN_MAP_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_APP_RELEASE: ${{ inputs.version_name }}
      - run: npx cap sync android
        working-directory: apps/application
      - name: Build signed AAB
        working-directory: apps/application/android
        env:
          GYM4ME_ANDROID_KEYSTORE: ${{ runner.temp }}/gym4me-release.jks
          GYM4ME_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GYM4ME_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GYM4ME_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease -PGYM4ME_VERSION_CODE=${{ inputs.version_code }} -PGYM4ME_VERSION_NAME=${{ inputs.version_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: gym4me-${{ inputs.version_name }}-aab
          path: apps/application/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
