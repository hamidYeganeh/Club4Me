name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm test -w apps/backend -- --runInBand
      - run: npm run build

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:cap -w apps/application
        env:
          NEXT_PUBLIC_API_URL: https://api.gym4me.ir/api/v1
          NEXT_PUBLIC_WEBSITE_URL: https://gym4me.ir
          NEXT_PUBLIC_APP_RELEASE: ci
      - run: npx cap sync android
        working-directory: apps/application
      - run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: apps/application/android
      - uses: actions/upload-artifact@v4
        with:
          name: gym4me-debug-apk
          path: apps/application/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
