name: club4me

x-app: &app
  restart: unless-stopped
  stop_grace_period: 20s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - frontend

services:
  mongodb:
    image: mongo:7
    entrypoint: ["sh", "/opt/club4me/mongodb-entrypoint.sh"]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    env_file: .env.production
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./scripts/docker/mongodb-entrypoint.sh:/opt/club4me/mongodb-entrypoint.sh:ro
      - ./scripts/docker/mongodb-health.js:/opt/club4me/mongodb-health.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --file /opt/club4me/mongodb-health.js',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    env_file: .env.production
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - backend

  backend:
    <<: *app
    image: ${CLUB4ME_BACKEND_IMAGE:-club4me-backend:latest}
    env_file: .env.production
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first --tls-max-v1.2"
      MEDIA_LOCAL_DIR: /data/media
      MEDIA_PUBLIC_BASE_URL: https://api.gym4me.ir
    volumes:
      - ./.secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - media_data:/data/media
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7088/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - frontend
      - backend

  website:
    <<: *app
    image: ${CLUB4ME_WEBSITE_IMAGE:-club4me-website:latest}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7080/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  application:
    <<: *app
    image: ${CLUB4ME_APPLICATION_IMAGE:-club4me-application:latest}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7081/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  admin:
    <<: *app
    image: ${CLUB4ME_ADMIN_IMAGE:-club4me-admin:latest}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7082/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  business:
    <<: *app
    image: ${CLUB4ME_BUSINESS_IMAGE:-club4me-business:latest}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7083/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      website:
        condition: service_healthy
      application:
        condition: service_healthy
      admin:
        condition: service_healthy
      business:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/gym4me-runtime/acme:/var/www/certbot:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "--header=Host: gym4me.ir",
          "http://127.0.0.1/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true

volumes:
  mongo_data:
  redis_data:
  media_data:
