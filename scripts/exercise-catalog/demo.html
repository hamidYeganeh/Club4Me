<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کتابخانه حرکات · Club4Me</title>
<style>
@font-face{font-family:iran;src:url('/font.woff2')}*{box-sizing:border-box}body{margin:0;background:#f5f6f4;color:#20261f;font-family:iran, sans-serif}header{background:white;border-bottom:1px solid #e2e6df;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:850;direction:ltr}.brand span{color:#609735}.status{font-size:12px;color:#4c762d;background:#edf5e6;padding:8px 12px;border-radius:30px}main{max-width:1150px;margin:36px auto;padding:0 24px}.eyebrow{font-size:12px;color:#6d8460}h1{font-size:32px;margin:10px 0}p{color:#6c7469;line-height:1.9}.tools{display:flex;gap:12px;margin:26px 0 12px}input,select,button{font:inherit;border:1px solid #dce1d7;background:white;border-radius:12px;padding:12px 16px}input{flex:1;min-width:0}button{cursor:pointer}button:hover{border-color:#739d53}#count{font-size:12px;margin:14px 0;color:#737d6b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:0;text-align:right;overflow:hidden;border-radius:20px;display:flex;flex-direction:column;box-shadow:0 3px 12px #22331104}.visual{height:210px;background:#fff;position:relative;width:100%;display:grid;place-items:center}.visual img{width:100%;height:100%;object-fit:contain;padding:18px}.visual video{width:100%;height:100%;object-fit:contain}.badge{position:absolute;bottom:12px;right:12px;font-size:11px;padding:5px 10px;border-radius:20px;background:#edf5e6;color:#426d27}.body{padding:18px;width:100%;border-top:1px solid #eff1eb}.meta{font-size:11px;color:#7d8876;margin-bottom:7px}h2{font-size:17px;margin:0 0 7px}.english{direction:ltr;text-align:right;font-size:11px;color:#8b9386}.action{margin-top:15px;color:#588632;font-size:12px}.note{font-size:12px;margin:30px 0}dialog{border:0;border-radius:22px;padding:24px;max-width:680px;width:calc(100% - 32px);max-height:90vh;overflow:auto}dialog::backdrop{background:#17231188}#detail video,#detail img{width:100%;max-height:360px;object-fit:contain;background:#f5f6f4;border-radius:12px}#detail .instructions{white-space:pre-line;text-align:left;direction:ltr;font-size:14px}summary{cursor:pointer}a{color:#537a32}.close{float:left;padding:7px 13px}.empty{padding:35px;grid-column:1/-1}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9abe7c;outline-offset:3px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}}@media(max-width:480px){main{padding:0 16px;margin-top:24px}.grid{grid-template-columns:1fr}.tools{flex-direction:column}.visual{height:220px}.status{font-size:10px}}
</style><header><div class="brand">Club<span>4</span>Me</div><span class="status">● رسانه‌های محلی · بدون API خارجی</span></header><main><div class="eyebrow">تمرین / کتابخانه حرکات</div><h1>حرکت بعدی‌ات را پیدا کن.</h1><p>حرکات را ببین، راهنمای اجرا را باز کن و ویدئو را از همین سرور پخش کن.</p><div class="tools"><input id="search" aria-label="جست‌وجوی حرکت" placeholder="نام حرکت را جست‌وجو کن…" type="search"><select id="filter" aria-label="نوع رسانه"><option value="">همه حرکات</option><option value="video">دارای ویدئو</option></select></div><div id="count" aria-live="polite">در حال بارگذاری…</div><div class="grid" id="grid"></div><p class="note">پیش‌نمایش محلی با داده واقعی؛ هنوز به نسخه اصلی اپ وصل نشده. متن‌های منبع برای انتشار نیاز به بررسی و ترجمه دارند.</p></main><dialog id="modal"><button class="close" id="close" aria-label="بستن">✕</button><div id="detail"></div></dialog>
<script>
let items=[];const $=id=>document.getElementById(id);const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e};
function visual(e,detail=false){let m;if(detail&&e.video){m=node('video');m.src=e.video.url;m.controls=true;m.playsInline=true;m.preload='metadata'}else if(e.images.length){m=node('img');m.src=e.images[0].url;m.alt=e.name;m.loading='lazy'}else if(e.video){m=node('video');m.src=e.video.url;m.muted=true;m.preload='metadata';m.playsInline=true;m.setAttribute('aria-label',e.name)}else m=node('span','راهنمای حرکت');return m}
function open(e){$('detail').replaceChildren(node('h2',e.name),node('p',e.originalName),visual(e,true));$('detail').append(node('p',e.description,'instructions'));const credits=node('details');credits.append(node('summary','منبع و مجوز استفاده'));for(const a of [e.textAttribution,e.video,...e.images].filter(Boolean)){const p=node('p',(a.authors||[]).join('، ')+' · ');const link=node('a',a.license?.short_name||'مجوز');const url=a.license?.url;if(url&&/^https?:\/\//.test(url)){link.href=url;link.target='_blank';link.rel='noopener noreferrer'}p.append(link);credits.append(p)}$('detail').append(credits);$('modal').showModal()}
function render(){const q=$('search').value.trim().toLowerCase();const selected=items.filter(e=>(e.name+' '+e.originalName).toLowerCase().includes(q)&&(!$('filter').value||e.video));$('count').textContent=selected.length.toLocaleString('fa')+' حرکت · فایل‌های واقعی روی همین دستگاه';$('grid').replaceChildren();for(const e of selected){const card=node('button',null,'card');card.type='button';const v=node('div',null,'visual');v.append(visual(e));v.append(node('span',e.video?'▶ ویدئوی اجرا':'راهنمای تصویری','badge'));const b=node('div',null,'body');b.append(node('div',e.category+' · '+(e.equipment||'بدون وسیله'),'meta'),node('h2',e.name),node('div',e.originalName,'english'),node('div','مشاهده حرکت ←','action'));card.append(v,b);card.onclick=()=>open(e);$('grid').append(card)}if(!selected.length)$('grid').append(node('p','حرکتی با این جست‌وجو پیدا نشد.','empty'))}
$('search').oninput=render;$('filter').onchange=render;$('close').onclick=()=>$('modal').close();$('modal').addEventListener('close',()=>{$('detail').querySelectorAll('video').forEach(v=>v.pause())});fetch('/catalog').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{items=data;render()}).catch(()=>$('count').textContent='دریافت کتابخانه محلی ناموفق بود.');
</script></html>
